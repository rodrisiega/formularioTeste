<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Contato - Barbearia do Navalha</title>

		<link rel="stylesheet" href="reset.css">
		<link rel="stylesheet" href="style.css">
		<link rel="shortcut icon" type='image/ico' href="imagens\favicon.ico">
	</head>
	<body>
		<header> <!-- cabeçalho -->
			<div class="caixa">
				<img src="imagens\logo-navalha.png">
				
				<nav>
					<ul>
						<li><a href="index3.html">Home</a></li>
						<li><a href='produtos.html'>Produtos</a></li>
						<li><a href="contato5.html">Contato</a></li>
					</ul>
				</nav>
			</div>	
		</header>

		<main>
			<form>
				<label for="nomesobrenome">Nome e Sobrenome</label>
				<input type="text" id="nomesobrenome" class="input-padrao" required> 
				
				<label for="email">Email</label>
				<input type="email" id="email" class="input-padrao" required placeholder="seuemail@dominio.com">
				
				<label for="telefone">Telefone</label>
				<input type="tel" id="telefone" class="input-padrao" required placeholder="(XX) XXXXX-XXXX">

				<label for="mensagem">Mensagem</label>
				<textarea cols="30" rows="10" id="mensagem" class="input-padrao" required></textarea>
				
				<fieldset> <!--Para melhorar a semântica substitui
					o div pelo fieldset. Ex: conjunto de campos do endereço, conjunto de dados do cartão -->
					<legend>Como prefere o nosso contato?</legend>
					<!--fieldset não tem p, tem legend-->
					<label for="radio-email"><input type="radio" name="contato" value="email" id="radio-email">Email</label> <!-- name é a propriedade que associa os radio buttons para não deixar marcar mais do que um -->

					<label for="radio-telefone"><input type="radio" name="contato" value="telefone" id="radio-telefone">Telefone</label>

					<label for="radio-whatsapp"><input type="radio" name="contato" value="whatsapp" id="radio-whatsapp" checked>WhatsApp</label>
				</fieldset>	

				<fieldset>
					<legend>Qual horário prefere ser atendido?</legend>
					<select>
						<option>Manhã</option>
						<option>Tarde</option>
						<option>Noite</option>
					</select>
				</fieldset>

				<label class="checkbox"><input type="checkbox" checked>Gostaria de receber nossas novidades por email?</label>

				<input type="submit" value="Enviar Formulário" class="enviar">
			
			</form>

			<table>
				<thead> <!-- cabeçalho da tabela -->
					<tr> <!--tr = table row (linhas) -->
						<th>Dia</th> <!--th = conteúdo do cabeçalho-->
						<th>Horário</th>
					</tr>
				</thead>
				<tbody>
					<tr>
						<td>Segunda</td> <!--td = table data (colunas)-->
						<td>8h ~ 20h</td>
					</tr>	
					<tr>
						<td>Quarta</td>
						<td>8h ~ 20h</td>
					</tr>	
					<tr>
						<td>Sexta</td>
						<td>8h ~ 20h</td>
					</tr>	
				</tbody>		
			</table>
		</main>

		<footer> <!-- rodapé -->
			<img src="imagens\logo-branco.png">
			<p class="copyright">&copy; Copyright Barbearia do Navalha - 2026</p>	
		</footer>
	</body>
</html>
